name: Publicar portafolio en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Versionar publicación
        shell: bash
        run: |
          BUILD_VERSION="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" index.html
          printf '{"version":"%s"}\n' "${BUILD_VERSION}" > version.json
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
